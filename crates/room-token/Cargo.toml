[package]
name = "xmoq-room-token"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The token of a room that the relay checks: its text, made and read with the key the relay shares with the room"

[lints]
workspace = true

[dependencies]
xmoq-moqt = { path = "../moqt" }
# HMAC-SHA-256. Already built, under quinn.
ring = { version = "=0.17.14", optional = true }

[features]
default = ["keys"]
# The key, and making and reading a token with it (lib.rs has why apart).
keys = ["dep:ring"]
