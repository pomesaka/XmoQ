[package]
name = "xmoq-viewer-io"
version = "0.0.0"
description = "What a viewer of a room does on its sockets, for xmoq-watch and xmoq-agent: the room's HTTP API, the requests of a session, the catalog, and the chat on tracks."
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xmoq-again = { path = "../again" }
xmoq-chat-tracks = { path = "../chat-tracks" }
xmoq-loc = { path = "../loc" }
xmoq-moqt = { path = "../moqt" }
xmoq-moqt-io = { path = "../moqt-io" }
xmoq-msf = { path = "../msf" }
xmoq-viewer = { path = "../viewer" }
anyhow = "=1.0.100"
tokio = { version = "=1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The room's HTTP API, in `room_client.rs` alone (why reqwest, at its top).
# Without its default features: they bring aws-lc-rs (a C build), HTTP/2
# and the system's proxy, none of which a room needs. The crypto provider is
# rustls's ring, which quinn already builds, installed in `room_client.rs`.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
# The fake room of `room_client.rs` reads and writes its socket.
tokio = { version = "=1.49.0", features = ["io-util"] }
