[package]
name = "xmoq-moqt-client"
version = "0.0.0"
description = "MoQ Transport client over WebTransport, built on xmoq-moqt."
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xmoq-loc = { path = "../loc" }
xmoq-moqt = { path = "../moqt" }
xmoq-msf = { path = "../msf" }
xmoq-moqt-io = { path = "../moqt-io" }
anyhow = "=1.0.100"
tokio = { version = "=1.49.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# WHY test-util: the waits of a served FETCH are seconds, which the tests run
# on tokio's paused clock.
tokio = { version = "=1.49.0", features = ["test-util"] }
