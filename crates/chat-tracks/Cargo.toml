[package]
name = "xmoq-chat-tracks"
version = "0.0.0"
description = "The tracks of the chat: the names of its namespaces and tracks, the payloads of said, lines, reacted, reactions and present, and the limits of a line. Without I/O."
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xmoq-moqt = { path = "../moqt" }
serde_json = "=1.0.152"
# For the counts of `reactions` in their order (`reactions.rs`).
serde = "=1.0.229"
