[package]
name = "xmoq-watch"
version = "0.0.0"
description = "A viewer for the terminal: the picture of a broadcast with the Kitty graphics protocol, its sound, and the chat of its room."
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xmoq-again = { path = "../again" }
xmoq-chat-tracks = { path = "../chat-tracks" }
xmoq-loc = { path = "../loc" }
xmoq-moqt = { path = "../moqt" }
xmoq-moqt-io = { path = "../moqt-io" }
xmoq-msf = { path = "../msf" }
# The video decoder (`openh264`) is there, in one file.
xmoq-picture = { path = "../picture" }
xmoq-room-token = { path = "../room-token" }
xmoq-viewer = { path = "../viewer" }
xmoq-subscriber = { path = "../subscriber" }
xmoq-viewer-io = { path = "../viewer-io" }
anyhow = "=1.0.100"
serde_json = "=1.0.152"
tokio = { version = "=1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The decoder is decided (src/bin/xmoq-watch/sound.rs) and the output is not
# (docs/open-questions.md); each is used in one file of src/bin/xmoq-watch.
opus-rs = "=0.1.39"
cpal = "=0.18.2"
# The terminal's line mode and the size of its window, without `unsafe`.
rustix = { version = "=1.1.5", features = ["termios", "stdio"] }
