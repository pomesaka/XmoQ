[package]
name = "xmoq-relay"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The XmoQ relay: MoQ Transport draft 18 over WebTransport"

[lints]
workspace = true

[dependencies]
xmoq-moqt = { path = "../moqt" }
xmoq-moqt-io = { path = "../moqt-io" }
xmoq-relay-core = { path = "../relay-core" }
xmoq-room-token = { path = "../room-token" }
anyhow = "=1.0.100"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# The tests sign texts that are no token of the room's form as well.
ring = "=0.17.14"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
