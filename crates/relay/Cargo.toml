[package]
name = "xmoq-relay"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The XmoQ relay: MoQ Transport draft 18 over WebTransport"

[lints]
workspace = true

[dependencies]
xmoq-moqt = { path = "../moqt" }
xmoq-moqt-io = { path = "../moqt-io" }
xmoq-relay-core = { path = "../relay-core" }
anyhow = "=1.0.100"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
