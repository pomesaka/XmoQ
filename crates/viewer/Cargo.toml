[package]
name = "xmoq-viewer"
version = "0.0.0"
description = "What a viewer of a room decides, for xmoq-watch and xmoq-agent: what a room says, and which lines of the chat on tracks are fetched and shown. Without I/O."
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xmoq-meeting-tracks = { path = "../meeting-tracks" }
serde_json = "=1.0.152"
xmoq-moqt = { path = "../moqt" }
xmoq-room-token = { path = "../room-token", default-features = false }
