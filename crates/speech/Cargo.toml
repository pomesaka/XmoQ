[package]
name = "xmoq-speech"
version = "0.0.0"
description = "The words of an audio track: its Opus decoded, cut where there is a voice, and read by a reader, whisper.cpp by default."
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.100"
# The same decoder as xmoq-watch's sound (why, in crates/watch/src/bin/xmoq-watch/sound.rs).
opus-rs = "=0.1.39"
# whisper.cpp 1.8.3, built from the source it carries; used in src/whisper.rs and src/vad.rs alone (README).
whisper-rs = "=0.16.0"

# WHY Metal on macOS: the large model read 8.6 s of speech in 1.3 s with it and in 4.0 s on the
# processor alone (README). Elsewhere whisper.cpp reads on the processor.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }
