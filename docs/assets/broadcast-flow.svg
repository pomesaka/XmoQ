<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-label="Broadcast and subscription"><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9eef9}.heading{font-size:26px;font-weight:750}.sub{font-size:14px;fill:#9eabc3}.name{font-size:17px;font-weight:700}.desc{font-size:13px;fill:#a8b5cd}.tag{font-size:12px;font-weight:650}.line{fill:none;stroke:#69dacd;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{fill:none;stroke:#e4b869;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round}.chat{fill:none;stroke:#b9a3f2;stroke-width:3;stroke-linecap:round}</style><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#69dacd"/></marker><marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e4b869"/></marker><marker id="vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b9a3f2"/></marker></defs><rect width="960" height="800" rx="20" fill="#0c1220"/><rect x="22" y="22" width="916" height="756" rx="18" fill="#111b2c" stroke="#26364c"/><text x="54" y="67" class="heading">Broadcast and subscription</text><text x="54" y="93" class="sub">BUILT AND RUN ON ONE MACHINE · NOT DEPLOYED</text>
<rect x="25" y="125" width="160" height="48" rx="15" fill="#2b2547" stroke="#38516a" stroke-width="1.5"/><text x="105" y="155" class="name" text-anchor="middle">Chat gatherer</text><path d="M105 173 V760" stroke="#3b526d" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="210" y="125" width="160" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="290" y="155" class="name" text-anchor="middle">Publisher</text><path d="M290 173 V760" stroke="#3b526d" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="395" y="125" width="160" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="475" y="155" class="name" text-anchor="middle">Rust Relay</text><path d="M475 173 V760" stroke="#3b526d" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="580" y="125" width="160" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="660" y="155" class="name" text-anchor="middle">Viewer</text><path d="M660 173 V760" stroke="#3b526d" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="765" y="125" width="160" height="48" rx="15" fill="#352d35" stroke="#38516a" stroke-width="1.5"/><text x="845" y="155" class="name" text-anchor="middle">Durable Objects</text><path d="M845 173 V760" stroke="#3b526d" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M290 200 H845" class="dashed" marker-end="url(#amb)"/><text x="752" y="191" class="desc" text-anchor="middle">token · where it is</text>
<path d="M290 245 H475" class="line" marker-end="url(#arr)"/><text x="382" y="236" class="desc" text-anchor="middle">PUBLISH</text>
<path d="M660 290 H845" class="dashed" marker-end="url(#amb)"/><text x="752" y="281" class="desc" text-anchor="middle">where it is · token</text>
<path d="M660 335 H475" class="line" marker-end="url(#arr)"/><text x="567" y="326" class="desc" text-anchor="middle">SUBSCRIBE · Joining FETCH</text>
<path d="M475 380 H660" class="line" marker-end="url(#arr)"/><text x="567" y="371" class="desc" text-anchor="middle">latest Group, then Objects</text>
<text x="54" y="448" class="tag" fill="#b9a3f2">CHAT ON TRACKS · THE GATHERER, THE DEMO'S PAGES AND THE TERMINAL VIEWER; THE ROOM'S WEBSOCKET CARRIES NO CHAT</text>
<path d="M105 480 H475" class="chat" marker-end="url(#vio)"/><text x="290" y="471" class="desc" text-anchor="middle">SUBSCRIBE_NAMESPACE xmoq/chat</text>
<path d="M660 525 H475" class="chat" marker-end="url(#vio)"/><text x="567" y="516" class="desc" text-anchor="middle">PUBLISH_NAMESPACE …/&lt;room&gt;/&lt;name&gt;</text>
<path d="M475 570 H105" class="chat" marker-end="url(#vio)"/><text x="290" y="561" class="desc" text-anchor="middle">NAMESPACE; it subscribes to said</text>
<path d="M660 615 H475" class="chat" marker-end="url(#vio)"/><text x="567" y="606" class="desc" text-anchor="middle">said: a line a Group</text><path d="M475 615 H105" class="chat" marker-end="url(#vio)"/><text x="290" y="606" class="desc" text-anchor="middle">numbered, kept in SQLite</text>
<path d="M105 660 H475" class="chat" marker-end="url(#vio)"/><text x="290" y="651" class="desc" text-anchor="middle">PUBLISH lines of xmoq/chat/&lt;room&gt;</text><path d="M475 660 H660" class="chat" marker-end="url(#vio)"/><text x="567" y="651" class="desc" text-anchor="middle">lines; latest by FETCH</text>
<path d="M54 712 H94" class="chat"/><text x="104" y="716" class="desc">The gatherer (xmoq-chat), the demo's pages (@xmoq/chat) and the terminal viewer (xmoq-chat-tracks)</text>
<text x="480" y="752" class="desc" text-anchor="middle">The room's WebSocket carries tokens and where a broadcast is; the relay checks a token where it has the room's key.</text>
</svg>
