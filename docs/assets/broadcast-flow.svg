<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-label="Broadcast and subscription"><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9eef9}.heading{font-size:26px;font-weight:750}.sub{font-size:14px;fill:#9eabc3}.name{font-size:17px;font-weight:700}.desc{font-size:13px;fill:#a8b5cd}.tag{font-size:12px;font-weight:650}.line{fill:none;stroke:#69dacd;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{fill:none;stroke:#e4b869;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round}.chat{fill:none;stroke:#b9a3f2;stroke-width:3;stroke-linecap:round}.moving{fill:none;stroke:#b9a3f2;stroke-width:2.5;stroke-dasharray:3 6;stroke-linecap:round}</style><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#69dacd"/></marker><marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e4b869"/></marker><marker id="vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b9a3f2"/></marker></defs><rect width="960" height="800" rx="20" fill="#0c1220"/><rect x="22" y="22" width="916" height="756" rx="18" fill="#111b2c" stroke="#26364c"/><text x="54" y="67" class="heading">Broadcast and subscription</text><text x="54" y="93" class="sub">PROPOSED HAPPY PATH · INTEROPERABILITY NOT YET VERIFIED</text>
