<path d="M605 272 H630 V185 H652" class="dashed" marker-end="url(#amb)"/>
<path d="M480 508 V557" class="chat" marker-start="url(#vio)" marker-end="url(#vio)"/>
<rect x="56" y="684" width="14" height="5" rx="2" fill="#69dacd"/><text x="80" y="691" class="desc">MoQ over WebTransport, through the relay</text>
<path d="M440 687 H480" class="dashed"/><text x="490" y="691" class="desc">Relay and room: undecided</text>
<rect x="56" y="710" width="14" height="5" rx="2" fill="#b9a3f2"/><text x="80" y="717" class="desc">The chat's tracks, which every client says and reads through the relay</text>
<rect x="580" y="710" width="14" height="5" rx="2" fill="#f0a6c8"/><text x="604" y="717" class="desc">Sound in, transcript out</text>
