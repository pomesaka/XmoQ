<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-label="System architecture"><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9eef9}.heading{font-size:26px;font-weight:750}.sub{font-size:14px;fill:#9eabc3}.name{font-size:18px;font-weight:700}.desc{font-size:13px;fill:#a8b5cd}.tag{font-size:12px;font-weight:650}.line{fill:none;stroke:#69dacd;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{fill:none;stroke:#e4b869;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round}.chat{fill:none;stroke:#b9a3f2;stroke-width:3;stroke-linecap:round}.speech{fill:none;stroke:#f0a6c8;stroke-width:3;stroke-linecap:round}</style><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#69dacd"/></marker><marker id="vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b9a3f2"/></marker><marker id="pnk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#f0a6c8"/></marker><marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e4b869"/></marker></defs><rect width="960" height="760" rx="20" fill="#0c1220"/><rect x="22" y="22" width="916" height="716" rx="18" fill="#111b2c" stroke="#26364c"/><text x="54" y="67" class="heading">System architecture</text><text x="54" y="93" class="sub">BUILT AND RUN ON ONE MACHINE · NOT DEPLOYED</text>
<rect x="55" y="140" width="250" height="90" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="180" y="173" class="name" text-anchor="middle">Browser publisher</text><text x="180" y="198" class="desc" text-anchor="middle">TypeScript · WebCodecs</text><text x="180" y="217" class="desc" text-anchor="middle">video · sound · MSF catalog</text>
<rect x="55" y="300" width="250" height="90" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="180" y="333" class="name" text-anchor="middle">Browser viewer, meeting</text><text x="180" y="358" class="desc" text-anchor="middle">TypeScript · WebCodecs</text><text x="180" y="377" class="desc" text-anchor="middle">captions · chat</text>
<rect x="55" y="420" width="250" height="90" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="180" y="453" class="name" text-anchor="middle">Agent's reader</text><text x="180" y="478" class="desc" text-anchor="middle">xmoq-agent · lines of JSON</text><text x="180" y="497" class="desc" text-anchor="middle">transcript · pictures · chat</text>
<rect x="355" y="255" width="250" height="250" rx="15" fill="#143c40" stroke="#38516a" stroke-width="1.5"/><text x="480" y="300" class="name" text-anchor="middle">Rust MoQ relay</text><text x="480" y="330" class="desc" text-anchor="middle">own MoQ Transport, draft 18</text><text x="480" y="352" class="desc" text-anchor="middle">fan-out · the latest Group cached</text><text x="480" y="374" class="desc" text-anchor="middle">tokens of the room</text><text x="480" y="396" class="desc" text-anchor="middle">a relay above it (--parent)</text><text x="480" y="418" class="desc" text-anchor="middle">another when full (--when-full)</text>
<rect x="655" y="140" width="250" height="90" rx="15" fill="#352d35" stroke="#38516a" stroke-width="1.5"/><text x="780" y="173" class="name" text-anchor="middle">Durable Objects (room)</text><text x="780" y="198" class="desc" text-anchor="middle">broadcast · tokens · seats</text><text x="780" y="217" class="desc" text-anchor="middle">in Miniflare only</text>
<rect x="655" y="270" width="250" height="90" rx="15" fill="#3b2536" stroke="#38516a" stroke-width="1.5"/><text x="780" y="303" class="name" text-anchor="middle">Transcriber</text><text x="780" y="328" class="desc" text-anchor="middle">xmoq-transcriber · whisper.cpp</text><text x="780" y="347" class="desc" text-anchor="middle">sound in · transcript out</text>
<rect x="655" y="400" width="250" height="90" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="780" y="433" class="name" text-anchor="middle">Terminal viewer</text><text x="780" y="458" class="desc" text-anchor="middle">xmoq-watch · Kitty graphics</text><text x="780" y="477" class="desc" text-anchor="middle">sound · chat</text>
<rect x="355" y="560" width="250" height="90" rx="15" fill="#2b2547" stroke="#38516a" stroke-width="1.5"/><text x="480" y="593" class="name" text-anchor="middle">Chat gatherer</text><text x="480" y="618" class="desc" text-anchor="middle">xmoq-chat · a client of the relay</text><text x="480" y="637" class="desc" text-anchor="middle">said in · lines out · SQLite</text>
<path d="M305 185 H480 V252" class="line" marker-end="url(#arr)"/><text x="392" y="175" class="tag" text-anchor="middle">MoQ / WT</text>
<path d="M352 345 H308" class="line" marker-end="url(#arr)"/>
<path d="M352 465 H308" class="line" marker-end="url(#arr)"/>
