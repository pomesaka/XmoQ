<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-label="Protocol and media layers"><defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e9eef9}.heading{font-size:26px;font-weight:750}.sub{font-size:14px;fill:#9eabc3}.name{font-size:18px;font-weight:700}.desc{font-size:13px;fill:#a8b5cd}.tag{font-size:12px;font-weight:650}.line{fill:none;stroke:#69dacd;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{fill:none;stroke:#e4b869;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round}</style><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#69dacd"/></marker><marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e4b869"/></marker></defs><rect width="960" height="576" rx="20" fill="#0c1220"/><rect x="22" y="22" width="916" height="532" rx="18" fill="#111b2c" stroke="#26364c"/><text x="54" y="67" class="heading">Protocol and media layers</text><text x="54" y="93" class="sub">BROWSER MEDIA PATH · CONCEPTUAL STACK</text>
<rect x="78" y="122" width="804" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="103" y="143" class="name" text-anchor="start">Application</text><text x="854" y="153" class="desc" text-anchor="end">live video · audio · chat (chat transport TBD)</text><rect x="78" y="179" width="804" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="103" y="200" class="name" text-anchor="start">Media processing</text><text x="854" y="210" class="desc" text-anchor="end">WebCodecs · buffering / A/V sync TBD</text><rect x="78" y="236" width="804" height="48" rx="15" fill="#143c40" stroke="#38516a" stroke-width="1.5"/><text x="103" y="257" class="name" text-anchor="start">MoQ</text><text x="854" y="267" class="desc" text-anchor="end">Track · Group · Object · publish / subscribe</text><rect x="78" y="293" width="804" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="103" y="314" class="name" text-anchor="start">WebTransport</text><text x="854" y="324" class="desc" text-anchor="end">session · streams · datagrams</text><rect x="78" y="350" width="804" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="103" y="371" class="name" text-anchor="start">HTTP/3</text><text x="854" y="381" class="desc" text-anchor="end">WebTransport session establishment</text><rect x="78" y="407" width="804" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="103" y="428" class="name" text-anchor="start">QUIC</text><text x="854" y="438" class="desc" text-anchor="end">connections · multiplexing · congestion control</text><rect x="78" y="464" width="804" height="48" rx="15" fill="#17283b" stroke="#38516a" stroke-width="1.5"/><text x="103" y="485" class="name" text-anchor="start">UDP / IP</text><text x="854" y="495" class="desc" text-anchor="end">network transport</text>
<text x="480" y="546" class="desc" text-anchor="middle">A MoQ Track is not a QUIC stream. Media playback logic sits outside MoQ.</text>
