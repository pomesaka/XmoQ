# Rust is not listed here: rust-toolchain.toml pins it, so plain `cargo` outside mise uses the
# same version.
[tools]
actionlint = "1.7.12"
biome = "2.5.15"
# WHY not 1.3.12: its `test.each` does not keep its table alive, so a garbage
# collection between `test.each(table)` and the call that follows hands the
# test rows of something else. Fixed in 1.3.14 (oven-sh/bun pull request
# 30050, read on 2026-10-11); see
# docs/experiments/2026-10-11-bun-test-each-loses-its-table.md.
bun = "1.3.14"
# xmoq-speech builds whisper.cpp with cmake (the build script of whisper-rs-sys 0.15.0). Pinned
# here so that CI, where mise-action installs these tools, builds with the same one.
cmake = "4.4.4"
# The interop run builds moqlivemock, a publisher written in Go, from a tag (scripts/ci/interop.sh);
# its go.mod asks for this version.
go = "1.26.0"
jq = "1.7.1"
# oxlint is installed from npm (it has shipped no standalone binary since 1.17.0), so it needs node.
node = "24.21.0"
oxlint = "1.87.0"
shellcheck = "0.11.0"

# CI runs these same tasks (.github/workflows/ci.yml), one job per check:* task. Add a check to
# the script, not to the workflow, so local runs and CI cannot drift apart.
[tasks.check]
description = "Run every check that CI runs"
depends = ["check:rust", "check:ts", "check:layers", "check:workflows"]

[tasks."check:rust"]
description = "cargo fmt --check, clippy and test for the workspace"
run = "scripts/ci/check-rust.sh"

[tasks."check:ts"]
description = "Biome, oxlint, typecheck and bun test for packages/"
run = "scripts/ci/check-ts.sh"

[tasks."check:layers"]
description = "Dependency rules: I/O-free crates, nothing depends on spikes/"
run = "scripts/ci/check-layers.sh"

[tasks."check:workflows"]
description = "actionlint for workflows and shellcheck for scripts/ci"
run = "scripts/ci/check-workflows.sh"

# Not part of `check`: it builds the moqtail relay and needs a Chromium, which takes minutes the
# first time. CI runs it in a job of its own.
[tasks.interop]
description = "Build the interop peers, run every pairing of own and moqtail clients and the runs in which a client leaves"
run = "scripts/ci/interop.sh"

[tasks.watch]
description = "The viewer for the terminal: mise run watch -- --room http://127.0.0.1:8787/rooms/demo"
run = "cargo run --release --locked -p xmoq-watch --"

[tasks.chat]
description = "The gatherer of the chat: mise run chat -- --url https://host:port/ --cert-sha256 <hex> --store chat.sqlite3"
run = "cargo run --locked -p xmoq-chat --"

[tasks.transcriber]
description = "The transcriber: mise run transcriber -- --url https://host:port/ --cert-sha256 <hex> --namespace xmoq/demo"
run = "cargo run --release --locked -p xmoq-transcriber --"

[tasks.agent]
description = "The reader of a room for an agent: mise run agent -- --room http://127.0.0.1:8787/rooms/demo --out /tmp/room"
run = "cargo run --release --locked -p xmoq-agent --"

[tasks.agent-demo]
description = "A demo of its own on other ports, the agent's reader in its room and the publishing page in a headless Chromium, in the background: mise run agent-demo -- start --out /tmp/room, then stop --out /tmp/room"
run = "scripts/agent-demo.sh"

[tasks.speech-model]
description = "Fetch a model of whisper.cpp for xmoq-speech into ~/.cache/xmoq/whisper: mise run speech-model -- [small-q5_1 (default)|tiny|large-v3-turbo-q5_0] [--dir <dir>]"
run = "crates/speech/scripts/fetch-model.sh"

[tasks.demo]
description = "Start the own relay, the gatherer of the chat, the transcriber and the pages of the demo: one publishes video, others watch"
run = "cargo build --locked -p xmoq-relay -p xmoq-chat && cargo build --release --locked -p xmoq-transcriber && bun install --frozen-lockfile && (test -d spikes/durable-objects-room/node_modules || npm ci --prefix spikes/durable-objects-room --no-audit --no-fund) && bun demo/serve.ts"

[tasks.fmt]
description = "Apply formatting and safe lint fixes"
run = "scripts/ci/fmt.sh"
