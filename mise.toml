# Rust is not listed here: rust-toolchain.toml pins it, so plain `cargo` outside mise uses the
# same version.
[tools]
actionlint = "1.7.12"
biome = "2.5.15"
bun = "1.3.12"
jq = "1.7.1"
# oxlint is installed from npm (it has shipped no standalone binary since 1.17.0), so it needs node.
node = "24.21.0"
oxlint = "1.87.0"
shellcheck = "0.11.0"

# CI runs these same tasks (.github/workflows/ci.yml), one job per check:* task. Add a check to
# the script, not to the workflow, so local runs and CI cannot drift apart.
[tasks.check]
description = "Run every check that CI runs"
depends = ["check:rust", "check:ts", "check:layers", "check:workflows"]

[tasks."check:rust"]
description = "cargo fmt --check, clippy and test for the workspace"
run = "scripts/ci/check-rust.sh"

[tasks."check:ts"]
description = "Biome, oxlint, typecheck and bun test for packages/"
run = "scripts/ci/check-ts.sh"

[tasks."check:layers"]
description = "Dependency rules: I/O-free crates, nothing depends on spikes/"
run = "scripts/ci/check-layers.sh"

[tasks."check:workflows"]
description = "actionlint for workflows and shellcheck for scripts/ci"
run = "scripts/ci/check-workflows.sh"

# Not part of `check`: it builds the moqtail relay and needs a Chromium, which takes minutes the
# first time. CI runs it in a job of its own.
[tasks.interop]
description = "Build the interop peers and run every pairing of own and moqtail clients"
run = "scripts/ci/interop.sh"

[tasks.fmt]
description = "Apply formatting and safe lint fixes"
run = "scripts/ci/fmt.sh"
