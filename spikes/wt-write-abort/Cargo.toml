[package]
name = "xmoq-wt-write-abort-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Spike only: a WebTransport server that stops streams, closes the session or
# just holds everything, so that a page can record what its writers fail with.
# Built on its own; the root workspace excludes `spikes/`.
[workspace]

[dependencies]
anyhow = "=1.0.100"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "time"] }
# The library and version the own relay runs on.
web-transport-quinn = { version = "=0.13.2", default-features = false, features = ["ring"] }
