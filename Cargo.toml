[workspace]
resolver = "3"
members = ["crates/*"]
# Phase 0 spikes and the moqtail peers of the interop runs pin their own dependency sets and
# are built on their own. Without this, spikes/moqtail/rust-client and
# interop/peers/moqtail/rust-client no longer build.
exclude = ["spikes", "interop"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_conversions = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
